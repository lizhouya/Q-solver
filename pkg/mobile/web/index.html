<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Q-Solver · 手机同步端</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-soft: #111c33;
      --card: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-bright: #818cf8;
      --success: #34d399;
      --error: #f87171;
      --thinking: #fbbf24;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      line-height: 1.6;
      /* safe-area：底部留出 iPhone 横条距离 */
      padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 28px);
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ===== Header ===== */
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 2px 6px; flex-wrap: wrap;
    }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; color: #fff;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    h1 { font-size: 16px; margin: 0; font-weight: 700; white-space: nowrap; }
    .subtitle { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* ===== Badge（业务状态）===== */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; padding: 3px 10px;
      border-radius: 999px; border: 1px solid var(--border); color: var(--muted);
    }
    .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .badge.live { color: var(--success); border-color: rgba(52, 211, 153, .4); }
    .badge.live .dot { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .badge.error { color: var(--error); border-color: rgba(248, 113, 113, .4); }
    .badge.error .dot { background: var(--error); }
    .badge.thinking { color: var(--thinking); border-color: rgba(251, 191, 36, .4); }
    .badge.thinking .dot { background: var(--thinking); }

    /* 连接状态行（连接层，独立于业务 badge）*/
    .conn-line { font-size: 11px; color: var(--muted); padding: 2px 2px 8px; }
    .conn-line.err { color: var(--error); }

    /* ===== 布局容器 ===== */
    #layout { display: flex; gap: 16px; align-items: flex-start; }

    /* ===== History 侧栏（≥900 显示）===== */
    .history-panel {
      width: clamp(200px, 22vw, 240px);
      flex-shrink: 0;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex; flex-direction: column;
      position: sticky; top: 10px;
      max-height: calc(100vh - 20px);
    }
    .history-panel .history-head {
      padding: 10px 12px; font-size: 12px; font-weight: 700;
      color: var(--muted); border-bottom: 1px solid var(--border);
      letter-spacing: .4px;
    }
    .history-list { overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

    /* 历史卡片（侧栏 + strip 共用基础）*/
    .hist-card {
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; cursor: pointer;
      font-size: 11.5px; color: var(--muted); line-height: 1.45;
      transition: background .15s ease, border-color .15s ease;
      text-align: left; width: 100%;
    }
    .hist-card:hover { background: var(--card); }
    .hist-card.active {
      background: rgba(99, 102, 241, .12); border-color: rgba(99, 102, 241, .55); color: var(--text);
    }
    .hist-card .hist-title {
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
      color: var(--text); font-weight: 500; margin-bottom: 2px;
    }
    .hist-card .hist-time { font-size: 10.5px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
    .hist-empty { padding: 14px 10px; font-size: 12px; color: var(--muted); text-align: center; }

    /* 顶部横向 History strip（<900 显示） */
    .history-strip { display: none; margin-bottom: 8px; }
    .history-strip .history-list { flex-direction: row; overflow-x: auto; }

    /* ===== Answer 主区 ===== */
    #answer-panel { flex: 1; min-width: 0; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px; margin-bottom: 14px; overflow-wrap: break-word;
    }
    .card-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; color: var(--muted);
      letter-spacing: .4px; text-transform: uppercase; margin-bottom: 12px;
    }
    .card-title .ico { font-size: 13px; }

    /* 等待动画 */
    .waiting { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 0; }
    .spinner {
      width: 30px; height: 30px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .waiting p { margin: 0; color: var(--muted); font-size: 13px; }

    /* 答案排版（参考 PC：标题/段落/列表/粗体/代码/表格） */
    .md { font-size: 15px; color: var(--text); word-break: break-word; }
    .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.05em 0 .45em; font-weight: 700; }
    .md h1 { font-size: 1.35em; color: var(--accent-bright); border-bottom: 1px solid var(--border); padding-bottom: .2em; }
    .md h2 { font-size: 1.18em; color: var(--accent-bright); }
    .md h3 { font-size: 1.07em; }
    .md h4 { font-size: 1em; }
    .md p { margin: .55em 0; }
    .md ul, .md ol { margin: .5em 0; padding-left: 1.4em; }
    .md li { margin: .18em 0; }
    .md strong { color: #f8fafc; font-weight: 700; }
    .md code {
      background: var(--bg-soft); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 5px; font-size: 13px; font-family: ui-monospace, "Segoe UI", monospace;
    }
    .md pre {
      background: var(--bg-soft); border: 1px solid var(--border);
      padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 12.5px;
      font-family: ui-monospace, "Segoe UI", monospace; line-height: 1.5; margin: .6em 0;
    }
    .md pre code { background: none; border: none; padding: 0; font-size: inherit; }
    .md blockquote { border-left: 3px solid var(--border); margin: .6em 0; padding-left: 12px; color: var(--muted); }
    .md a { color: #818cf8; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.2em 0; }
    .md table { border-collapse: collapse; margin: .6em 0; width: 100%; font-size: 13.5px; }
    .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
    .md th { background: var(--bg-soft); font-weight: 700; }

    /* 答案/解析 语义强调（仅视觉，不推断选项值） */
    .md .tag-answer { color: #34d399; font-weight: 800; }
    .md .tag-analysis { color: #fbbf24; font-weight: 800; }

    .error-diagnostics { margin-top: 12px; font-size: 13px; }
    .error-diagnostics summary { cursor: pointer; }
    .error-diagnostics pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
    .error-diagnostics p { line-height: 1.6; }
    .error-box { background: rgba(248, 113, 113, .08); border: 1px solid rgba(248, 113, 113, .35); color: var(--error); }

    /* 快捷键提示：默认折叠，只展示服务端下发的动作标签和显示名 */
    #shortcut-card { padding: 0; }
    #shortcut-details { border-radius: inherit; }
    .shortcut-summary {
      display: flex; align-items: center; gap: 8px; min-height: 42px;
      padding: 9px 14px; cursor: pointer; color: var(--muted);
      font-size: 12px; font-weight: 700; letter-spacing: .3px;
      list-style: none; user-select: none;
    }
    .shortcut-summary::-webkit-details-marker { display: none; }
    .shortcut-summary-title { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .shortcut-count-badge {
      margin-left: auto; padding: 1px 7px; border: 1px solid var(--border);
      border-radius: 999px; color: var(--muted); font-size: 10.5px; font-weight: 600;
    }
    .shortcut-toggle::before { content: '展开'; font-size: 10.5px; font-weight: 500; color: var(--accent-bright); }
    #shortcut-details[open] .shortcut-toggle::before { content: '收起'; }
    .shortcut-content { padding: 0 14px 14px; border-top: 1px solid var(--border); }
    .shortcut-content .copy-note { margin: 10px 0; }
    .hints-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
    }
    .hint-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--bg-soft); color: var(--muted); font-size: 12px;
    }
    .hint-item span { min-width: 0; overflow-wrap: anywhere; }
    .hint-item kbd {
      flex-shrink: 0; max-width: 58%; overflow-wrap: anywhere;
      padding: 2px 7px; border: 1px solid #475569; border-bottom-width: 2px; border-radius: 6px;
      background: #0f172a; color: var(--text); font: 600 11px/1.45 ui-monospace, Consolas, monospace;
    }

    .copy-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .copy-actions button { color: var(--text); background: var(--bg-soft); border: 1px solid var(--border); border-radius: 7px; padding: 7px 12px; cursor: pointer; }
    .copy-actions button:disabled { opacity: .5; cursor: not-allowed; }
    .copy-note, #copy-feedback { color: var(--muted); font-size: 12px; }
    .footer { text-align: center; font-size: 10px; color: var(--muted); opacity: .6; padding: 10px 0 2px; }

    /* ===== 响应式断点 =====
       Phone <768：单栏 Answer-first，History 用顶部横向 strip
       Portrait 768–899：单列 Answer + 紧凑 strip（不强制双栏）
       Landscape ≥900：双栏（侧栏 History + 主 Answer）*/
    @media (max-width: 899px) {
      .history-panel { display: none; }
      .history-strip { display: block; }
      header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">Q</div>
      <div>
        <h1>Q-Solver 手机同步端</h1>
        <div class="subtitle" id="model-label">等待桌面连接…</div>
      </div>
    </div>
    <div class="header-right">
      <span id="status-badge" class="badge"><span class="dot"></span>未连接</span>
    </div>
  </header>

  <div class="conn-line" id="conn-line">正在连接…</div>

  <!-- 顶部 History strip（<900px 显示） -->
  <div class="history-strip" id="history-strip">
    <div class="history-list" id="history-list-strip"></div>
  </div>

  <div id="layout">
    <!-- 左侧 History（≥900px 双栏） -->
    <aside class="history-panel" id="history-panel">
      <div class="history-head">历史记录</div>
      <div class="history-list" id="history-list-side"></div>
    </aside>

    <!-- 右侧 Answer 主区 -->
    <div id="answer-panel">
      <!-- 实际快捷键提示（由 Snapshot.hints 提供，不含 VK/路径/Token） -->
      <div class="card" id="shortcut-card" hidden>
        <details id="shortcut-details">
          <summary class="shortcut-summary">
            <span class="shortcut-summary-title"><span class="ico">⌨</span> 答题端快捷键</span>
            <span class="shortcut-count-badge"><span id="shortcut-count">0</span> 项</span>
            <span class="shortcut-toggle" aria-hidden="true"></span>
          </summary>
          <div class="shortcut-content">
            <p class="copy-note">以下按键在答题电脑使用，不是浏览器快捷键。</p>
            <div class="hints-grid" id="shortcut-hints"></div>
          </div>
        </details>
      </div>

      <!-- 等待中 -->
      <div class="card" id="waiting-card" style="display:none">
        <div class="waiting">
          <div class="spinner"></div>
          <p id="waiting-text">正在等待解题结果…</p>
        </div>
      </div>

      <!-- 最终答案 -->
      <div class="card" id="answer-card" style="display:none">
        <div class="card-title"><span class="ico">💡</span> 参考答案</div>
        <div class="md" id="answer-text"></div>
        <div class="copy-actions">
          <button type="button" id="copy-numbered-answers" hidden disabled>复制题号＋答案</button>
          <button type="button" id="copy-answers" hidden disabled>复制答案</button>
          <span id="copy-feedback" role="status" aria-live="polite"></span>
        </div>
      </div>

      <!-- 错误 -->
      <div class="card error-box" id="error-card" style="display:none">
        <div class="card-title"><span class="ico">⚠️</span> 求解出错</div>
        <div class="md" id="error-text"></div>
        <details class="error-diagnostics" id="error-diagnostics">
          <summary>诊断详情</summary>
          <pre id="error-diagnostics-text"></pre>
          <p>仅反映当前调用边界，不代表最终上游原因。不会自动重试，重试可能产生费用；详情未写入题库。</p>
        </details>
      </div>
    </div>
  </div>

  <div class="footer">Q-Solver · 局域网同步 · 只读</div>

  <script>
    // =====================================================================
    // 常量与状态
    // =====================================================================
    var sessionHistory = [];  // { seq, ts, question, answer, model }——仅浏览器内存
    var latestSnapshot = null; // 最新一帧（仅用于「跟随最新」与刷新恢复）
    var selectedSeq = -1;      // -1=跟随最新；否则选中 history 中的 seq
    var activeSessionId = '';  // 当前服务进程命名空间；不写入浏览器存储
    var activeClearSeq = -1;   // 当前会话已接受的清屏水位
    var renderEpoch = 0;       // 清屏/换会话时递增，使已排队渲染回调失效
    var retiredSessionIds = Object.create(null); // 防止新进程帧到达后又切回已淘汰会话
    var lastControlSeq = -1;   // 独立的一次性控制序号；SSE snapshot 只负责同步基线
    var lastBusinessSeq = -1;  // 最近真正渲染的业务快照；控制帧不得触发重渲染
    var lastHintsSignature = '';
    var answerScrollPending = false;
    var answerScrollVersion = 0;

    // =====================================================================
    // DOM 引用
    // =====================================================================
    var statusBadge = document.getElementById('status-badge');
    var connLine = document.getElementById('conn-line');
    var modelLabel = document.getElementById('model-label');
    var waitingCard = document.getElementById('waiting-card');
    var waitingText = document.getElementById('waiting-text');
    var answerCard = document.getElementById('answer-card');
    var answerText = document.getElementById('answer-text');
    var copyNumberedAnswers = document.getElementById('copy-numbered-answers');
    var copyAnswers = document.getElementById('copy-answers');
    var copyFeedback = document.getElementById('copy-feedback');
    var displayedCopyText = '';
    var displayedNumberedText = '';
    var copyVersion = 0;
    function formatNumberedAnswers(items, plainText) {
      if (!plainText || typeof plainText !== 'string' || !Array.isArray(items) || !items.length) return '';
      if (items.some(item => !item || item.status !== 'ready' ||
        typeof item.label !== 'string' || !item.label.trim() || /[\r\n]/.test(item.label) || item.label.includes('待核对') ||
        typeof item.value !== 'string' || !item.value || /[\r\n]/.test(item.value))) return '';
      if (items.map(item => item.value).join('\n') !== plainText) return '';
      return items.map(item => `${item.label}. ${item.value}`).join('\n')
    }

    function setCopyTarget(payload) {
      copyVersion++;
      displayedCopyText = payload && typeof payload.answerCopyText === 'string' ? payload.answerCopyText : '';
      displayedNumberedText = formatNumberedAnswers(payload && payload.answerItems, displayedCopyText);
      copyNumberedAnswers.hidden = !payload;
      copyNumberedAnswers.disabled = !displayedNumberedText;
      copyAnswers.hidden = !payload;
      copyAnswers.disabled = !displayedCopyText;
      copyFeedback.textContent = payload && !displayedCopyText ? '本轮汇总缺失或含待核对项，暂不可复制答案' : '';
    }
    async function copyDisplayedAnswers(withNumbers) {
      var numbered = withNumbers === true;
      var text = numbered ? displayedNumberedText : displayedCopyText;
      if (!text || (numbered ? copyNumberedAnswers.disabled : copyAnswers.disabled)) return false;
      var version = copyVersion;
      copyAnswers.disabled = true;
      copyNumberedAnswers.disabled = true;
      var success = false;
      try {
        if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          success = true;
        }
      } catch (_) {}
      if (!success && version === copyVersion) {
        var textarea;
        var focused = document.activeElement;
        try {
          textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          success = document.execCommand('copy') === true;
        } catch (_) {} finally {
          if (textarea) textarea.remove();
          try { if (focused) focused.focus({ preventScroll: true }); } catch (_) {}
        }
      }
      if (version === copyVersion) {
        copyAnswers.disabled = !displayedCopyText;
        copyNumberedAnswers.disabled = !displayedNumberedText;
        copyFeedback.textContent = success ? (numbered ? '已复制题号＋答案' : '已复制答案（不含题号与解析）') : '复制失败，请手动选择答案复制';
      }
      return success;
    }
    copyAnswers.addEventListener('click', copyDisplayedAnswers);
    copyNumberedAnswers.addEventListener('click', function () { return copyDisplayedAnswers(true); });
    var errorCard = document.getElementById('error-card');
    var errorText = document.getElementById('error-text');
    var errorDiagnostics = document.getElementById('error-diagnostics');
    var errorDiagnosticsText = document.getElementById('error-diagnostics-text');
    var shortcutCard = document.getElementById('shortcut-card');
    var shortcutDetails = document.getElementById('shortcut-details');
    var shortcutCount = document.getElementById('shortcut-count');
    var shortcutHints = document.getElementById('shortcut-hints');
    var histSide = document.getElementById('history-list-side');
    var histStrip = document.getElementById('history-list-strip');

    // =====================================================================
    // 通用渲染 helper
    // =====================================================================
    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function safeExternalHref(href) {
      var value = String(href || '').trim();
      return /^(?:https?:|mailto:)/i.test(value) ? value : '';
    }
    // 传入已 escape 的文本，做结构性标记（行内代码 / 粗体 / 斜体 / 链接）
    function toInline(escaped) {
      return escaped
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, label, href) {
          var safeHref = safeExternalHref(href);
          if (!safeHref) return label;
          return '<a href="' + safeHref + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
        });
    }
    function paragraphWithLabel(line) {
      var esc = escapeHtml(line);
      // 视觉强调「答案：/正确答案：/解析：」开头的段落（仅视觉格式化，不推断选项）
      var m = esc.match(/^\s*(?:【)?(?:答案|正确答案|解析)(?:】)?[:：]/);
      if (m) {
        var labelEnd = m[0].length;
        var label = esc.slice(0, labelEnd).trim();
        var rest = esc.slice(labelEnd).trim();
        var cls = /解析/.test(label) ? 'tag-analysis' : 'tag-answer';
        return '<span class="' + cls + '">' + label + '</span>' + (rest ? ' ' + rest : '');
      }
      return esc;
    }
    function isTableLine(line) {
      return /^\s*\|?[\s:|-]*\s*$/.test(line) && /-/.test(line.replace(':|-', '')) && line.includes('-');
    }
    function renderMarkdown(md) {
      if (!md) return '';
      var lines = md.split('\n');
      var out = [];
      var i = 0;
      while (i < lines.length) {
        var line = lines[i];

        // 代码块
        if (/^```/.test(line.trim())) {
          var buf = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i].trim())) { buf.push(lines[i]); i++; }
          i++; // 跳过收尾 ```
          out.push('<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');
          continue;
        }
        // 表格
        if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|/.test(lines[i + 1]) && isTableLine(lines[i + 1])) {
          var headerParts = line.replace(/^\s*\||\|\s*$/g, '').split('|').map(function (s) { return s.trim(); });
          i += 2; // 跳过表头 + 分隔行
          var rows = [];
          while (i < lines.length && /^\s*\|/.test(lines[i]) && !isTableLine(lines[i])) {
            rows.push(lines[i].replace(/^\s*\||\|\s*$/g, '').split('|').map(function (s) { return s.trim(); }));
            i++;
          }
          var html = '<table><thead><tr>';
          headerParts.forEach(function (h) { html += '<th>' + toInline(escapeHtml(h)) + '</th>'; });
          html += '</tr></thead><tbody>';
          rows.forEach(function (r) {
            html += '<tr>';
            r.forEach(function (c) { html += '<td>' + toInline(escapeHtml(c)) + '</td>'; });
            html += '</tr>';
          });
          html += '</tbody></table>';
          out.push(html);
          continue;
        }
        // 标题
        var h = line.match(/^(#{1,4})\s+/);
        if (h) {
          var lv = h[1].length;
          out.push('<h' + lv + '>' + toInline(escapeHtml(line.slice(lv).trim())) + '</h' + lv + '>');
          i++;
          continue;
        }
        // 引用
        if (/^>\s?/.test(line)) {
          var quote = line.replace(/^>\s?/, '');
          out.push('<blockquote>' + toInline(escapeHtml(quote)) + '</blockquote>');
          i++;
          continue;
        }
        // 无序列表
        if (/^\s*[-*+]\s+/.test(line)) {
          var items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
            items.push(lines[i].replace(/^\s*[-*+]\s+/, ''));
            i++;
          }
          out.push('<ul>' + items.map(function (x) { return '<li>' + toInline(escapeHtml(x)) + '</li>'; }).join('') + '</ul>');
          continue;
        }
        // 有序列表
        if (/^\s*\d+[.、)]\s+/.test(line)) {
          var oitems = [];
          while (i < lines.length && /^\s*\d+[.、)]\s+/.test(lines[i])) {
            oitems.push(lines[i].replace(/^\s*\d+[.、)]\s+/, ''));
            i++;
          }
          out.push('<ol>' + oitems.map(function (x) { return '<li>' + toInline(escapeHtml(x)) + '</li>'; }).join('') + '</ol>');
          continue;
        }
        // 分隔线
        if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
        // 空行
        if (line.trim() === '') { i++; continue; }
        // 普通段落
        out.push('<p>' + toInline(paragraphWithLabel(line)) + '</p>');
        i++;
      }
      return out.join('\n');
    }

    // =====================================================================
    // 业务状态与连接状态（两者分离）
    // =====================================================================
    function setBadge(text, cls) {
      statusBadge.className = 'badge' + (cls ? ' ' + cls : '');
      statusBadge.textContent = '';
      var dot = document.createElement('span');
      dot.className = 'dot';
      statusBadge.appendChild(dot);
      statusBadge.appendChild(document.createTextNode(text));
    }
    function setConn(text, err) {
      connLine.textContent = text;
      connLine.className = 'conn-line' + (err ? ' err' : '');
    }
    function showWaiting(msg) {
      setCopyTarget(null);
      waitingText.textContent = msg || '正在等待解题结果…';
      waitingCard.style.display = 'block';
      answerCard.style.display = 'none';
      errorCard.style.display = 'none';
      clearErrorDiagnostics();
    }
    function showAnswer(html, payload) {
      setCopyTarget(payload);
      answerText.innerHTML = html;
      waitingCard.style.display = 'none';
      answerCard.style.display = 'block';
      errorCard.style.display = 'none';
      clearErrorDiagnostics();
    }
    function scheduleLatestAnswerScroll() {
      if (selectedSeq >= 0 || answerScrollPending) return false;
      answerScrollPending = true;
      var scheduledEpoch = renderEpoch;
      var scheduledVersion = ++answerScrollVersion;
      requestAnimationFrame(function () {
        if (scheduledVersion !== answerScrollVersion) return;
        answerScrollPending = false;
        if (scheduledEpoch !== renderEpoch || selectedSeq >= 0) return;
        var root = document.scrollingElement || document.documentElement;
        var rootHeight = root && Number(root.scrollHeight) || 0;
        var bodyHeight = document.body && Number(document.body.scrollHeight) || 0;
        window.scrollTo({ top: Math.max(rootHeight, bodyHeight), behavior: 'smooth' });
      });
      return true;
    }
    function clearErrorDiagnostics() {
      errorDiagnostics.open = false;
      errorDiagnosticsText.textContent = '';
    }
    function renderErrorDiagnostics(detail) {
      clearErrorDiagnostics();
      if (!detail || typeof detail !== 'object') {
        errorDiagnosticsText.textContent = '暂无信息：此错误未提供结构化诊断。';
        return;
      }
      var codes = ['invalid_config', 'cancelled', 'timeout', 'network_error', 'tls_error',
        'authentication_failed', 'permission_denied', 'not_found_or_protocol_mismatch',
        'invalid_request', 'rate_limited', 'quota_exhausted', 'request_too_large',
        'provider_unavailable', 'empty_response', 'invalid_response', 'incomplete_response',
        'stream_interrupted', 'refused', 'vision_mismatch', 'vision_inconclusive', 'probe_disabled', 'response_failed'];
      var stages = ['validate_config', 'build_request', 'send_request', 'read_response',
        'stream_response', 'validate_response', 'validate_probe'];
      var protocols = ['openai_chat', 'openai_responses', 'anthropic_messages'];
      var code = codes.indexOf(detail.code) >= 0 ? detail.code : 'unknown';
      var status = Number.isInteger(detail.httpStatus) && detail.httpStatus >= 100 && detail.httpStatus <= 599 ? detail.httpStatus : '未知';
      var retry = code === 'unknown' || code === 'response_failed' ? '未知，请先定位原因' :
        detail.retryable === true ? '可手动重试' : detail.retryable === false ? '不建议直接重试，请先检查配置或请求' : '未知，请先定位原因';
      errorDiagnosticsText.textContent = [
        '错误类别：' + (code === 'unknown' ? '未知（unknown）' : code),
        '失败阶段：' + (stages.indexOf(detail.stage) >= 0 ? detail.stage : '未知'),
        'HTTP 状态码：' + status,
        '实际请求协议：' + (protocols.indexOf(detail.protocol) >= 0 ? detail.protocol : '未知'),
        '是否建议重试：' + retry
      ].join(String.fromCharCode(10));
    }
    function showError(msg, detail) {
      renderErrorDiagnostics(detail);
      setCopyTarget(null);
      errorText.innerHTML = escapeHtml(msg || '未知错误');
      waitingCard.style.display = 'none';
      answerCard.style.display = 'none';
      errorCard.style.display = 'block';
    }
    function clearDisplayState() {
      setCopyTarget(null);
      renderEpoch++;
      answerScrollVersion++;
      answerScrollPending = false;
      sessionHistory = [];
      latestSnapshot = null;
      selectedSeq = -1;
      lastControlSeq = -1;
      lastBusinessSeq = -1;
      lastHintsSignature = '';

      modelLabel.textContent = '等待桌面连接…';
      waitingText.textContent = '正在等待解题结果…';
      answerText.innerHTML = '';
      errorText.innerHTML = '';
      waitingCard.style.display = 'none';
      answerCard.style.display = 'none';
      errorCard.style.display = 'none';
      clearErrorDiagnostics();
      shortcutHints.textContent = '';
      shortcutCount.textContent = '0';
      shortcutDetails.open = false;
      shortcutCard.hidden = true;
      histSide.textContent = '';
      histStrip.textContent = '';
      setBadge('待命', '');
    }

    // =====================================================================
    // Remote History（仅浏览器内存，按 seq 去重）
    // =====================================================================
    function fmtTime(ts) {
      var d = new Date(ts || Date.now());
      return (d.getHours() < 10 ? '0' + d.getHours() : d.getHours()) + ':' + (d.getMinutes() < 10 ? '0' + d.getMinutes() : d.getMinutes());
    }
    function findHistory(seq) {
      for (var i = 0; i < sessionHistory.length; i++) if (sessionHistory[i].seq === seq) return i;
      return -1;
    }
    // done 时写入；同 seq→更新而非新增
    function upsertHistory(snap) {
      var p = snap.payload || {};
      var entry = {
        seq: snap.seq,
        ts: snap.ts || Date.now(),
        question: p.question || '',
        answer: p.answer || '',
        answerItems: p.answerItems || [],
        answerCopyText: p.answerCopyText || '',
        model: p.model || ''
      };
      var idx = findHistory(snap.seq);
      if (idx >= 0) { sessionHistory[idx] = entry; return; }
      sessionHistory.push(entry);
      sessionHistory.sort(function (a, b) { return a.seq - b.seq; });
    }
    function activeSeq() {
      if (selectedSeq >= 0) return selectedSeq;
      if (latestSnapshot) return latestSnapshot.seq;
      return -1;
    }
    function buildHistCard(e) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'hist-card';
      card.setAttribute('data-seq', e.seq);
      var title = document.createElement('div');
      title.className = 'hist-title';
      var t = e.question || e.answer;
      title.textContent = t ? t.replace(/\s+/g, ' ').substring(0, 60) : '解答';
      var time = document.createElement('div');
      time.className = 'hist-time';
      time.textContent = fmtTime(e.ts);
      card.appendChild(title);
      card.appendChild(time);
      card.addEventListener('click', function () { selectHistory(e.seq); });
      return card;
    }
    function renderHistoryList() {
      [histSide, histStrip].forEach(function (listEl) {
        listEl.textContent = '';
        if (sessionHistory.length === 0) {
          var d = document.createElement('div');
          d.className = 'hist-empty';
          d.textContent = '暂无历史';
          listEl.appendChild(d);
          return;
        }
        sessionHistory.forEach(function (e) {
          var card = buildHistCard(e);
          if (e.seq === activeSeq()) card.className = 'hist-card active';
          listEl.appendChild(card);
        });
      });
    }
    function selectHistory(seq) {
      // 点击历史：右侧切换为该条 Answer；选中高亮
      var idx = findHistory(seq);
      if (idx < 0) { return; }
      if (seq === (latestSnapshot && latestSnapshot.seq)) { selectedSeq = -1; }
      else { selectedSeq = seq; }
      var e = sessionHistory[idx];
      if (e) showAnswer(renderMarkdown(e.answer), e);
      setBadge('已完成', 'live');
      renderHistoryList();
    }

    // =====================================================================
    // 快捷键提示与一次性滚动控制
    // =====================================================================
    function renderHints(hints) {
      shortcutHints.textContent = '';
      if (!Array.isArray(hints) || hints.length === 0) {
        shortcutCount.textContent = '0';
        shortcutCard.hidden = true;
        return;
      }
      hints.forEach(function (hint) {
        if (!hint || !hint.label || !hint.keyName) return;
        var item = document.createElement('div');
        item.className = 'hint-item';
        var label = document.createElement('span');
        label.textContent = String(hint.label);
        var key = document.createElement('kbd');
        key.textContent = String(hint.keyName);
        item.appendChild(label);
        item.appendChild(key);
        shortcutHints.appendChild(item);
      });
      shortcutCount.textContent = String(shortcutHints.childElementCount);
      shortcutCard.hidden = shortcutHints.childElementCount === 0;
    }
    function applyHintsIfChanged(hints) {
      var signature = JSON.stringify(Array.isArray(hints) ? hints : []);
      if (signature === lastHintsSignature) return false;
      lastHintsSignature = signature;
      renderHints(hints);
      return true;
    }
    function normalizedControlSeq(snap) {
      var seq = Number(snap && snap.controlSeq);
      return Number.isFinite(seq) && seq >= 0 ? seq : 0;
    }
    function syncControlBaseline(snap) {
      // 初始 snapshot 只同步最近序号，不读取或执行 control。
      lastControlSeq = normalizedControlSeq(snap);
    }
    function applyRealtimeControl(snap) {
      var seq = normalizedControlSeq(snap);
      if (seq <= lastControlSeq) return false;
      lastControlSeq = seq;
      if (snap.control !== 'up' && snap.control !== 'down') return false;

      var direction = snap.control;
      var scheduledEpoch = renderEpoch;
      requestAnimationFrame(function () {
        if (scheduledEpoch !== renderEpoch) return;
        var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
        var distance = Math.max(1, Math.round(viewportHeight * 0.4));
        window.scrollBy({ top: direction === 'up' ? -distance : distance, behavior: 'smooth' });
      });
      return true;
    }

    // =====================================================================
    // 快照处理（业务层由 snapshot.status 驱动；连接层由 conn 回调驱动）
    // =====================================================================
    function validatedFrameIdentity(snap) {
      if (!snap || typeof snap.sessionId !== 'string' || snap.sessionId.trim() === '') return null;
      if (typeof snap.clearSeq !== 'number' || !Number.isFinite(snap.clearSeq) || snap.clearSeq < 0 || Math.floor(snap.clearSeq) !== snap.clearSeq) return null;
      return { sessionId: snap.sessionId, clearSeq: snap.clearSeq };
    }
    function acceptFrame(snap) {
      var identity = validatedFrameIdentity(snap);
      if (!identity) return false;

      if (identity.sessionId !== activeSessionId) {
        if (retiredSessionIds[identity.sessionId]) return false;
        if (activeSessionId) retiredSessionIds[activeSessionId] = true;
        activeSessionId = identity.sessionId;
        activeClearSeq = identity.clearSeq;
        clearDisplayState();
        return true;
      }
      if (identity.clearSeq < activeClearSeq) return false;
      if (identity.clearSeq > activeClearSeq) {
        activeClearSeq = identity.clearSeq;
        clearDisplayState();
      }
      return true;
    }
    function parseAcceptedFrame(e) {
      var snap;
      try {
        snap = JSON.parse(e.data);
      } catch (_) {
        return null;
      }
      return acceptFrame(snap) ? snap : null;
    }
    function normalizedBusinessSeq(snap) {
      var seq = Number(snap && snap.seq);
      return Number.isFinite(seq) && seq >= 0 ? seq : 0;
    }
    function isLatest(seq) {
      return latestSnapshot && latestSnapshot.seq === seq;
    }
    function applyBusinessSnapshotIfNew(snap) {
      // idle 仅承载空白/清屏边界，不占用清屏后的业务序号命名空间。
      if (snap.status === 'idle' || !snap.status) return false;
      var seq = normalizedBusinessSeq(snap);
      if (seq <= lastBusinessSeq) return false;
      lastBusinessSeq = seq;
      applySnapshot(snap);
      return true;
    }
    function applySnapshot(snap) {
      var payload = snap.payload || {};
      if (snap.status === 'idle' || !snap.status) {
        setBadge('待命', '');
        waitingCard.style.display = 'none';
        answerCard.style.display = 'none';
        errorCard.style.display = 'none';
        clearErrorDiagnostics();
        return;
      }

      latestSnapshot = snap;
      if (payload.model) modelLabel.textContent = '模型 ' + payload.model;

      if (selectedSeq >= 0) {
        if (snap.status === 'done') upsertHistory(snap);
        renderHistoryList();
        return;
      }
      if (snap.status === 'error') {
        setBadge('出错', 'error');
        showError(snap.error || '求解出错', snap.errorDetail);
        return;
      }
      if (snap.status === 'done') {
        upsertHistory(snap);           // 写入会话历史（去重）
        selectedSeq = -1;              // 新答案完成 → 自动选中最新
        setBadge('已完成', 'live');
        showAnswer(renderMarkdown(payload.answer || ''), payload);
        scheduleLatestAnswerScroll();
        renderHistoryList();
        return;
      }
      if (snap.status === 'streaming') {
        setBadge('处理中', 'thinking');
        // 不显示 analysis：streaming-thinking 阶段仅业务状态，不渲染正文
        if (payload.answer && (selectedSeq === -1 || isLatest(selectedSeq))) {
          showAnswer(renderMarkdown(payload.answer));
          scheduleLatestAnswerScroll();
        } else {
          showWaiting('正在分析题目…');
        }
        return;
      }
      if (snap.status === 'waiting') {
        setBadge('等待', 'thinking');
        showWaiting('正在等待解题结果…');
        return;
      }
      // 未知状态不恢复已清除的业务内容
      setBadge('待命', '');
      waitingCard.style.display = 'none';
      answerCard.style.display = 'none';
      errorCard.style.display = 'none';
      clearErrorDiagnostics();
    }

    // =====================================================================
    // 启动入口（001 修复：classic <script> 顶层禁止 return，包进函数）
    // =====================================================================
    function init() {
      var params = new URLSearchParams(location.search);
      var token = params.get('token');
      if (!token) {
        setBadge('无连接', 'error');
        setConn('缺少连接凭据。请从桌面端设置中获取二维码/URL。', true);
        return;
      }

      var es = null;
      function connect() {
        setConn('连接中…');
        es = new EventSource('/sse?token=' + encodeURIComponent(token));
        es.onopen = function () {
          setConn('已连接', false); // 连接层：SSE 通道已建立
        };
        es.addEventListener('snapshot', function (e) {
          var snap = parseAcceptedFrame(e);
          if (!snap) return;
          setConn('已连接 · 同步最新', false); // 连接层
          syncControlBaseline(snap);             // 首帧只对齐序号，不重放旧控制
          applyHintsIfChanged(snap.hints);
          applyBusinessSnapshotIfNew(snap);      // 首次或断线期间出现新业务状态才渲染
        });
        es.addEventListener('message', function (e) {
          var snap = parseAcceptedFrame(e);
          if (!snap) return;
          setConn('已连接', false); // 连接层
          applyHintsIfChanged(snap.hints);
          applyBusinessSnapshotIfNew(snap); // 相同业务 seq 的控制帧不得重建 DOM
          applyRealtimeControl(snap);        // 布局稳定后执行一次性滚动
        });
        es.onerror = function () {
          setConn('连接断开，正在自动重连…', true); // 连接层；EventSource 内建自动重连
        };
      }
      connect();

      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && (!es || es.readyState === EventSource.CLOSED)) {
          connect();
        }
      });
    }
    init();
  </script>
</body>
</html>
